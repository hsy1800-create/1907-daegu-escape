<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>escape tests</title>
<style>body{font:14px/1.5 monospace;margin:12px}iframe{width:420px;height:760px;border:1px solid #999;float:right}.f{color:#c00}.p{color:#080}</style></head>
<body>
<iframe id="app" src="../index.html?local"></iframe>
<h3 id="sum">running…</h3>
<pre id="out"></pre>
<script>
const out = document.getElementById('out');
const T = [];
const test = (name, fn) => T.push({ name, fn });
const eq = (a, b, msg) => { const A = JSON.stringify(a), B = JSON.stringify(b); if (A !== B) throw new Error((msg || '') + ' expected ' + B + ' got ' + A); };
const ok = (c, msg) => { if (!c) throw new Error(msg || 'not ok'); };
const wait = ms => new Promise(r => setTimeout(r, ms));
const frame = () => document.getElementById('app');
const W = () => frame().contentWindow;
const D = () => frame().contentDocument;
const q = s => D().querySelector(s);
const qa = s => [...D().querySelectorAll(s)];
function reloadApp() { return new Promise(r => { frame().onload = () => setTimeout(r, 150); W().location.reload(); }); }
async function go(hash) { W().location.hash = hash; await wait(120); }
async function fresh() { try { W().Escape.store.clear(); } catch (e) {} W().location.hash = ''; await reloadApp(); }

// ---------------- Task 1: data and rules ----------------
test('STUDENTS has 20 numbers without 2, 15, 17', () => {
  const S = W().Escape.STUDENTS; eq(S.length, 20); ok(!S.includes(2) && !S.includes(15) && !S.includes(17));
});
test('groupOf maps numbers to group and seat', () => {
  const g = W().Escape.groupOf;
  eq(g(1), { group: 1, seat: 1 }); eq(g(6), { group: 1, seat: 5 }); eq(g(7), { group: 2, seat: 1 });
  eq(g(18), { group: 3, seat: 5 }); eq(g(23), { group: 4, seat: 5 }); eq(g(2), null); eq(g(15), null);
});
test('missionFor rotates missions by group', () => {
  const m = W().Escape.missionFor; eq(m(12), 3); eq(m(1), 1); eq(m(23), 3); eq(m(2), null);
});
test('groupCode per group', () => {
  const c = W().Escape.groupCode; eq([1, 2, 3, 4].map(c), ['60371', '03716', '37160', '71603']);
});
test('each student digit sits in the right place of the group code', () => {
  const E = W().Escape;
  for (const no of E.STUDENTS) { const { group, seat } = E.groupOf(no); eq(E.MISSIONS[E.missionFor(no)].digit, E.groupCode(group)[seat - 1], 'no ' + no); }
});
test('checkAnswer accepts digits, full-width, spaces, full years', () => {
  const a = W().Escape.checkAnswer;
  ok(a(1, ' ６ ')); ok(a(1, '1906')); ok(a(2, '0')); ok(a(2, '1907')); ok(a(5, '21')); ok(a(5, '1')); ok(!a(3, '4')); ok(!a(4, ''));
});
test('checkGroupCode', () => {
  const c = W().Escape.checkGroupCode; ok(c(3, '37160')); ok(c(3, ' 3 7 1 6 0 ')); ok(!c(3, '60371'));
});
test('gaugeWon', () => { const g = W().Escape.gaugeWon; eq(g(20), 13000000); eq(g(1), 650000); eq(g(0), 0); });
test('store survives a throwing storage backend', () => {
  const bad = { getItem() { throw new Error('blocked'); }, setItem() { throw new Error('blocked'); }, removeItem() { throw new Error('blocked'); } };
  const s = W().Escape.makeStore(bad); s.set('k', { a: 1 }); eq(s.get('k'), { a: 1 }); s.clear(); eq(s.get('k'), null);
});
test('every mission has clue and question; missions 1-4 have a video, mission 5 none', () => {
  const M = W().Escape.MISSIONS;
  for (let i = 1; i <= 5; i++) { ok(M[i].title && M[i].clue && M[i].extra && M[i].question, 'mission ' + i); }
  for (let i = 1; i <= 4; i++) { ok(M[i].video && M[i].video.id, 'video ' + i); }
  eq(M[5].video, null);
});

// ---------------- Realtime Task 1: quiz data and shared state ----------------
test('quizFor gives the four friends questions in seat order', () => {
  const E = W().Escape, qs = E.quizFor(12);
  eq(qs.map(x => x.friend), [13, 14, 16, 18]); eq(qs.map(x => x.mission), [4, 5, 1, 2]);
  ok(qs.every(x => x.q && x.options.length === 4 && x.title), 'shape'); eq(E.quizFor(2), []);
});
test('every mission has a quiz with four options and a valid answer', () => {
  const Q = W().Escape.QUIZ;
  for (let i = 1; i <= 5; i++) { ok(Q[i].q, 'q' + i); eq(Q[i].options.length, 4); ok(Q[i].answer >= 0 && Q[i].answer < 4, 'answer ' + i); }
  eq(W().Escape.COINS_NEEDED, 4);
});
test('sync stores, removes and clears shared data in local mode', () => {
  const s = W().Escape.sync; let seen = null; const un = s.subscribe(t => { seen = t; });
  s.set('donated/3', true); eq(s.tree().donated[3], true); eq(seen.donated[3], true);
  s.set('groups/2/f/cut', '과자'); eq(s.tree().groups[2].f.cut, '과자');
  s.set('donated/3', null); ok(!s.tree().donated || !s.tree().donated[3], 'removed');
  s.clear(5); eq(s.tree(), { session: 5 }); un(); eq(s.status(), 'local');
});

// ---------------- Task 2: student flow ----------------
function setVal(sel, v) { const el = q(sel); el.value = v; const Ev = W().Event; el.dispatchEvent(new Ev('input', { bubbles: true })); }
async function click(sel) { q(sel).click(); await wait(150); }
async function pick(no) { await fresh(); await go('#start'); q('button[data-no="' + no + '"]').click(); await wait(200); }
async function fillCode(code) { qa('.code-box').forEach((b, i) => { b.value = code[i] || ''; }); await click('#open'); }

test('start shows 20 number buttons without 2, 15, 17', async () => {
  await fresh(); await go('#start');
  eq(qa('button[data-no]').length, 20); ok(!q('button[data-no="2"]') && !q('button[data-no="15"]') && !q('button[data-no="17"]'));
});
test('picking 12 opens mission 3 as the first detective of group 3', async () => {
  await pick(12);
  eq(W().location.hash, '#mission'); const t = D().body.innerText;
  ok(t.includes('3모둠') && t.includes('첫째 탐정'), 'intro'); eq(q('#m-title').textContent.trim(), '서상돈의 계산');
});
test('two wrong answers highlight the key words in the clue', async () => {
  await pick(12);
  setVal('#answer', '4'); await click('#check'); ok(!q('#clue mark'), 'no mark after 1 wrong');
  setVal('#answer', '5'); await click('#check'); eq(q('#clue mark').textContent, '석 달');
});
test('right answer shows the secret digit and its place, kept after reload', async () => {
  await pick(12);
  setVal('#answer', '3'); await click('#check');
  eq(q('#digit').textContent.trim(), '3'); ok(q('#slot').textContent.includes('첫째 자리'));
  await reloadApp(); eq(W().location.hash, '#mission'); eq(q('#digit').textContent.trim(), '3');
});
test('vault opens with the group code and hints after three misses', async () => {
  await pick(12); setVal('#answer', '3'); await click('#check'); await click('#to-vault');
  eq(W().location.hash, '#vault'); eq(qa('.code-box').length, 5);
  await fillCode('60371'); await fillCode('11111'); ok(!q('#vault-msg').textContent.includes('자리'), 'no seat hint yet');
  await fillCode('22222'); ok(q('#vault-msg').textContent.includes('자리 순서'), 'seat hint');
  await fillCode('37160'); eq(W().location.hash, '#group');
});

// ---------------- Task 3 (realtime Task 2): group page on each tablet ----------------
const SY = () => W().Escape.sync;
async function openVaultAs(no, keep) {
  const E = W().Escape; if (keep) await pickKeep(no); else await pick(no);
  setVal('#answer', E.MISSIONS[E.missionFor(no)].digit); await click('#check'); await click('#to-vault');
  await fillCode(E.groupCode(E.groupOf(no).group));
}
async function openVault12() { await openVaultAs(12); }
const quizBtn = (m, i) => q('.quiz-card[data-mission="' + m + '"] button[data-opt="' + i + '"]');
async function answerRight(m) { quizBtn(m, W().Escape.QUIZ[m].answer).click(); await wait(120); }
test('group page has donation, class gauge, think, certificate and newspaper on each tablet', async () => {
  await openVault12();
  ok(q('#quiz') && q('#class-gauge') && q('#think') && q('#cert') && q('#news'), 'sections');
  eq(qa('.quiz-card').length, 4); ok(q('.quiz-card[data-mission="4"]').textContent.includes('13번'), 'friend 13 has mission 4');
  ok(q('#think').textContent.includes('까닭'), 'think question');
});
test('a right quiz answer earns a coin and is saved to the class data', async () => {
  await openVault12(); await answerRight(4);
  eq(SY().tree().quiz[12][4], true); ok(q('#coin-count').textContent.includes('1'), q('#coin-count').textContent);
  ok(q('.quiz-card[data-mission="4"]').classList.contains('done'), 'card marked done');
});
test('a wrong quiz answer locks that question and earns nothing', async () => {
  await openVault12();
  const wrong = [0, 1, 2, 3].find(i => i !== W().Escape.QUIZ[4].answer);
  quizBtn(4, wrong).click(); await wait(120);
  ok(qa('.quiz-card[data-mission="4"] button[data-opt]').every(b => b.disabled), 'locked');
  ok(q('.quiz-card[data-mission="4"] .quiz-msg').textContent.includes('13번'), 'ask friend 13');
  ok(!(SY().tree().quiz && SY().tree().quiz[12]), 'no coin');
  ok(!quizBtn(5, 0).disabled, 'other questions still open');
});
test('the donate button works only after four coins and puts in 65만 원', async () => {
  await openVault12();
  ok(q('#donate').disabled, 'disabled before coins');
  for (const m of [4, 5, 1, 2]) await answerRight(m);
  ok(!q('#donate').disabled, 'enabled after 4 coins'); await click('#donate');
  eq(SY().tree().donated[12], true); ok(q('#gauge-won').textContent.includes('65만 원'), q('#gauge-won').textContent);
  ok(q('#donate-box').textContent.includes('넣었어요'), 'thanks');
});
test('the class gauge rises live when other students donate and celebrates at 20', async () => {
  await openVault12();
  SY().set('donated/7', true); await wait(80); ok(q('#gauge-won').textContent.includes('65만 원'), q('#gauge-won').textContent);
  ok(q('#class-gauge .cell[data-no="7"]').classList.contains('on'), 'cell 7 on');
  for (const n of W().Escape.STUDENTS) SY().set('donated/' + n, true);
  await wait(80); ok(q('#gauge-won').textContent.includes('1,300만 원')); ok(!q('#celebrate').hidden, 'celebrate');
});
test('each member writes only their own parts and sees friends parts live', async () => {
  await openVault12();
  ok(q('#f-cut') && q('#f-fact1'), 'seat 1 parts'); ok(!q('#f-save') && !q('#f-slogan'), 'not other seats parts');
  setVal('#f-cut', '쉬는 시간 스마트폰'); eq(SY().tree().groups[3].f.cut, '쉬는 시간 스마트폰');
  SY().set('groups/3/f/save', '군것질 돈'); SY().set('groups/3/f/from', '11월 20일'); await wait(80);
  const t = q('#cert').textContent;
  ok(t.includes('3모둠') && t.includes('12번') && t.includes('18번') && t.includes('쉬는 시간 스마트폰') && t.includes('군것질 돈') && t.includes('11월 20일'), t);
  ok(q('[data-show="save"]').textContent.includes('군것질 돈'), 'friend part shown');
});
test('typing is not interrupted when a friend writes', async () => {
  await openVault12();
  const inp = q('#f-cut'); inp.focus(); setVal('#f-cut', '쉬는');
  SY().set('groups/3/f/save', '돈'); await wait(80);
  eq(q('#f-cut').value, '쉬는'); eq(D().activeElement && D().activeElement.id, 'f-cut');
});
test('my promise goes into the newspaper and stays after reload', async () => {
  await openVault12();
  setVal('#my-promise', '책 읽기'); eq(SY().tree().groups[3].p[12], '책 읽기');
  SY().set('groups/3/f/place', '대구'); SY().set('groups/3/f/slogan', '함께 갚아요'); await wait(80);
  let t = q('#news').textContent;
  ok(t.includes('대구에서 시작된 국채보상운동') && t.includes('12번') && t.includes('책 읽기') && t.includes('함께 갚아요'), t);
  await reloadApp(); eq(W().location.hash, '#group');
  ok(q('#news').textContent.includes('책 읽기'), 'kept'); eq(q('#my-promise').value, '책 읽기');
});
test('friends text is shown as text, not as HTML', async () => {
  await openVault12();
  SY().set('groups/3/f/slogan', '<b>굵게</b>'); SY().set('groups/3/p/13', '<img src=x>'); await wait(80);
  ok(!q('#news .slogan b'), 'no b in slogan'); ok(q('#news .slogan').textContent.includes('<b>굵게</b>'));
  ok(!q('#news img') && !q('[data-show="slogan"] b'), 'no elements from friends text');
});

// ---------------- Task 4: videos and library ----------------
test('mission video loads only after pressing the button', async () => {
  await pick(12);
  ok(q('#video-slot .video-btn'), 'button'); ok(!q('#video-slot iframe'), 'no iframe yet');
  await click('#video-slot .video-btn');
  const f = q('#video-slot iframe'); ok(f && f.src.includes('youtube-nocookie.com/embed/egeQ1xiwZ7Q'), 'iframe src');
});
test('mission 5 has no video button', async () => {
  await pick(6); eq(W().Escape.missionFor(6), 5); ok(!q('#video-slot .video-btn'));
});
test('library lists the four videos', async () => {
  await go('#library');
  eq(qa('.lib-item').length, 4); ok(D().body.innerText.includes('대구미래교육연구원') && D().body.innerText.includes('EBS'));
});

// ---------------- Task 5: teacher ----------------
async function teacher() { await fresh(); await go('#teacher'); setVal('#pin', '4129'); await click('#pin-ok'); }
test('teacher screen needs the PIN', async () => {
  await fresh(); await go('#teacher');
  ok(!q('.code-row'), 'locked'); setVal('#pin', '1907'); await click('#pin-ok'); ok(!q('.code-row'), 'wrong pin stays locked');
  setVal('#pin', '4129'); await click('#pin-ok'); eq(qa('.code-row').length, 4);
  ok(q('#codes').textContent.includes('37160') && q('#codes').textContent.includes('71603'));
});
test('teacher board shows donations live without any teacher clicks', async () => {
  await teacher();
  eq(qa('#board .cell[data-no]').length, 20); ok(!q('.coin[data-no]'), 'no teacher toggle buttons');
  SY().set('donated/1', true); SY().set('quiz/3/2', true); await wait(80);
  ok(q('#board .cell[data-no="1"]').classList.contains('on'), 'cell 1 on');
  ok(q('#gauge-won').textContent.includes('65만 원'), q('#gauge-won').textContent);
  ok(q('#groups-board').textContent.includes('3번'), 'group progress listed');
  for (const n of W().Escape.STUDENTS) SY().set('donated/' + n, true);
  await wait(80); ok(q('#gauge-won').textContent.includes('1,300만 원')); ok(!q('#celebrate').hidden, 'celebrate');
});
test('새 수업 시작 clears the class data and this device', async () => {
  await pick(12); await teacher(); SY().set('donated/1', true);
  W().confirm = () => true; await click('#reset');
  const t = SY().tree(); ok(!t.donated, 'donations cleared'); ok(typeof t.session === 'number' && t.session > 0, 'new session');
  eq(W().Escape.store.get('me'), null); eq(W().location.hash, '#start');
});
test('a new class session sends a student tablet back to the start', async () => {
  await pick(12); setVal('#answer', '3'); await click('#check'); ok(q('#digit'), 'solved');
  SY().clear(Date.now()); await wait(150);
  eq(W().location.hash, '#start'); eq(W().Escape.store.get('me'), null);
});
test('a tablet seeing the class data for the first time keeps its progress', async () => {
  await fresh();
  W().Escape.store.set('session', null);   // this tablet has never seen a session
  W().Escape.store.set('room', { session: 5 }); W().Escape.store.set('me', 12); W().Escape.store.set('solved', true);
  W().location.hash = '#mission'; await reloadApp();
  eq(W().location.hash, '#mission'); eq(W().Escape.store.get('me'), 12); eq(W().Escape.store.get('session'), 5); ok(q('#digit'), 'digit kept');
});

// ---------------- Final review fixes ----------------
async function pickKeep(no) { await go('#start'); q('button[data-no="' + no + '"]').click(); await wait(200); }
test('teacher screen locks again after leaving it', async () => {
  await teacher(); ok(q('.code-row'), 'unlocked first');
  await go('#start'); await go('#teacher');
  ok(!q('.code-row'), 'codes hidden after leaving'); ok(q('#pin'), 'asks for the PIN');
});
test('reset sends the device back to the start screen, locked', async () => {
  await teacher(); W().confirm = () => true; await click('#reset');
  eq(W().location.hash, '#start'); await go('#teacher'); ok(!q('.code-row'), 'locked after reset');
});
test('another group on the same device does not see the first group work', async () => {
  await openVaultAs(1); setVal('#f-cut', '1모둠 약속');
  ok(q('#cert').textContent.includes('1모둠 약속'), 'group 1 cert');
  await openVaultAs(13, true); eq(W().location.hash, '#group');
  ok(!q('#cert').textContent.includes('1모둠 약속'), 'group 3 cert is its own');
  await openVaultAs(1, true);
  ok(q('#cert').textContent.includes('1모둠 약속'), 'group 1 work is still there'); eq(q('#f-cut').value, '1모둠 약속');
});
test('Korean number words are accepted for missions 3 and 4', () => {
  const a = W().Escape.checkAnswer;
  ok(a(3, '석'), '석'); ok(a(3, '석 달'), '석 달'); ok(a(3, '세'), '세'); ok(a(3, '삼'), '삼');
  ok(a(4, '일곱'), '일곱'); ok(a(4, '일곱 명'), '일곱 명'); ok(a(4, '칠'), '칠');
  ok(!a(3, '넷'), '넷 is wrong'); ok(!a(4, '여덟'), '여덟 is wrong');
});
test('an answer without a digit asks for a number and does not count as a miss', async () => {
  await pick(12); setVal('#answer', '모름'); await click('#check');
  ok(q('#msg').textContent.includes('숫자로'), q('#msg').textContent); eq(W().Escape.store.get('wrong'), 0);
  setVal('#answer', ''); await click('#check'); eq(W().Escape.store.get('wrong'), 0, 'empty box');
});
test('picking your own number again keeps your progress', async () => {
  await pick(12); setVal('#answer', '3'); await click('#check');
  await pickKeep(12); eq(W().location.hash, '#mission'); ok(q('#digit'), 'digit kept');
  await click('#to-vault'); await fillCode('37160');
  await pickKeep(12); eq(W().location.hash, '#group');
});
test('the secret digit is on screen right after a correct answer, even on a short screen', async () => {
  const f = frame(), h = f.style.height; f.style.height = '420px';
  try {
    await pick(1); setVal('#answer', '6'); await click('#check');
    const r = q('#digit').getBoundingClientRect(), vh = W().innerHeight;
    ok(r.top >= 0 && r.bottom <= vh, 'digit at ' + Math.round(r.top) + '..' + Math.round(r.bottom) + ' of ' + vh);
  } finally { f.style.height = h; await wait(50); }
});
test('history wording: one start date, plain 단연, documented 광문사 roles, clear certificate label', async () => {
  const M = W().Escape.MISSIONS;
  ok(!M[5].clue.includes('운동을 시작'), 'mission 5 must not give a second start date: ' + M[5].clue);
  ok(M[5].clue.includes('북후정') && M[5].clue.includes('2월 21일'), 'mission 5 keeps its answer');
  ok(M[3].extra.indexOf('담배를 끊는 것을 ‘단연’이라고 해요') === 0, M[3].extra);
  ok(M[1].extra.includes('사장') && M[1].extra.includes('부사장'), M[1].extra);
  await openVault12();
  ok(q('#cert') && !q('#cert').textContent.includes('의연한 모둠'), 'certificate label');
});

// ---------------- runner ----------------
(async () => {
  // about:blank counts as 'complete' before the real page arrives, so wait for the app itself
  for (let i = 0; i < 150 && !(W() && W().Escape && D().readyState === 'complete'); i++) await wait(100);
  await wait(200);
  let pass = 0, fail = 0;
  for (const t of T) {
    try { await t.fn(); pass++; out.innerHTML += '<span class="p">PASS</span> ' + t.name + '\n'; }
    catch (e) { fail++; out.innerHTML += '<span class="f">FAIL</span> ' + t.name + ' :: ' + e.message + '\n'; }
  }
  document.getElementById('sum').textContent = 'PASS ' + pass + ' / FAIL ' + fail + ' / TOTAL ' + T.length;
  window.__done = { pass, fail, total: T.length };
})();
</script>
</body></html>
